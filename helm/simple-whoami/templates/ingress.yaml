{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "simple-whoami.fullname" . }}
  labels:
    {{- include "simple-whoami.labels" . | nindent 4 }}
  {{- if or .Values.ingress.tls.enabled .Values.ingress.annotations }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer.name }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ include "simple-whoami.host" . }}
      secretName: {{ include "simple-whoami.tlsSecretName" . }}
  {{- end }}
  rules:
    - host: {{ include "simple-whoami.host" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "simple-whoami.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
